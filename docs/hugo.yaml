baseURL: "https://mudknight.github.io/comfyui-mudknight-utils"
locale: 'en-us'
title: "Mudknight Utils Docs"
theme: ["github.com/imfing/hextra"]
disableKinds: ["RSS"]

security:
  http:
    urls:
      - '(?i)^https?://[a-z]'
      - 'https://cdn.jsdelivr.net'

params:
  author: "mudknight"
  description: "Documentation for ComfyUI mudknight utils"
  github: "https://github.com/mudknight/comfyui-mudknight-utils"

  navbar:
    displayLogo: true
    logo: 
      path: "https://github.com/mudknight/comfyui-mudknight-utils/blob/main/assets/pipe.svg?raw=true"
      width: 64
      height: 32
    displaySearch: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: Github
      weight: 2
      url: "https://github.com/mudknight/comfyui-mudknight-utils"
      params:
        icon: github
